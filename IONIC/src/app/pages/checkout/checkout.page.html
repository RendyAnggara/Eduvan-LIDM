<ion-header mode="ios" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/course" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>Konfirmasi Pembelian</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="ion-no-margin">
    <ion-card-header>
      <ion-card-subtitle>Mata Pelajaran Pilihan</ion-card-subtitle>
      <ion-card-title style="font-weight: 700; font-size: 1.2rem">
        {{ subject.name }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <!-- Rincian Biaya -->
      <ion-list lines="full">
        <ion-item>
          <ion-label>Total Biaya</ion-label>
          <ion-note
            slot="end"
            color="success"
            style="font-size: 1.3rem; font-weight: 800"
          >
            Rp {{ subject.price | number }}
          </ion-note>
        </ion-item>
        <ion-item lines="none">
          <ion-label>Metode Pembayaran</ion-label>
          <ion-note slot="end" color="dark" style="font-weight: 600">
            DompetX Gateway
          </ion-note>
        </ion-item>
      </ion-list>

      <!-- Tombol Eksekusi -->
      <ion-button
        expand="block"
        color="success"
        style="margin-top: 24px; font-weight: 700"
        [disabled]="subject.price === 0"
        (click)="processPayment()"
      >
        BAYAR SEKARANG DENGAN DOMPETX
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
